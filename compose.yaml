name: football-rag

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: football-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: football_rag
      POSTGRES_PASSWORD: football_rag_dev
      POSTGRES_DB: football_rag
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U football_rag -d football_rag']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    container_name: football-rag-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: football-rag-minio
    profiles: ['object-storage']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: football_rag
      MINIO_ROOT_PASSWORD: football_rag_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ['object-storage']
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 football_rag football_rag_dev
        mc mb --ignore-existing local/football-rag-sources

  ollama:
    image: ollama/ollama:0.11.10
    container_name: football-rag-ollama
    profiles: ['models']
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:0.11.10
    profiles: ['models']
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command: ollama pull nomic-embed-text && ollama pull llama3.2:3b

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ['app']
    command: ['node', 'libs/database/dist/lib/run-migrations.js']
    environment: &backend-env
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://football_rag:football_rag_dev@postgres:5432/football_rag
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      SWAGGER_ENABLED: 'false'
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSIONS: 768
      LLM_MODEL: llama3.2:3b
      LLM_TEMPERATURE: 0
      LLM_SEED: 1
      LLM_NUM_CTX: 8192
      SEMANTIC_CANDIDATE_K: 40
      LEXICAL_CANDIDATE_K: 40
      RETRIEVAL_TOP_K: 8
      ASK_RATE_LIMIT_PER_MINUTE: 20
      DIAGNOSTICS_ENABLED: 'false'
      QUERY_LOG_RETENTION_DAYS: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ['app']
    environment:
      <<: *backend-env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles: ['app']
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    profiles: ['app']
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
